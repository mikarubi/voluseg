name: Build and Publish Docs to GitHub Pages

on:
  push:
    branches:
      - master
      - cleanup/mechanical-fixes  # temporary: validate CI before merge

jobs:
  build-and-publish:
    name: Build and Publish Docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install voluseg and docs tooling
        run: |
          pip install -e .
          pip install -r docs/requirements-docs.txt

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Generate API reference
        run: cd docs && quartodoc build

      - name: Render site
        run: quarto render docs

      # Generated files are never committed back to the branch; the site is
      # rebuilt from source on every push.
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_site
