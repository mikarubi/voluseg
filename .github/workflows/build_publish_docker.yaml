# Reference: https://github.com/docker/build-push-action
name: Docker Build and Publish

on:
  push:
    branches:
      - master
      - cleanup/mechanical-fixes  # temporary: build-only validation before merge
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Pull requests only verify that the image builds; only pushes to
    # master publish (as :latest), so PR branches never pollute GHCR.
    - name: Build docker image (and push from master)
      uses: docker/build-push-action@v3
      with:
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        tags: ghcr.io/${{ github.repository }}/voluseg:latest
        context: .
        file: Dockerfile

