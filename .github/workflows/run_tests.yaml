name: Tests

on:
  push:
    branches:
      - master
      - cleanup/mechanical-fixes  # temporary: validate CI before merge
  pull_request:
    branches:
      - master

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
        python:
          - '3.10'
          - '3.11'
          - '3.12'

    name: ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Install voluseg and dependencies
      - name: Install voluseg
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r tests/requirements.txt --no-cache-dir

      # Tests and coverage
      - name: Clear previous coverage data
        run: coverage erase

      - name: Run tests with pytest on Unix-like systems
        if: ${{ !startsWith(matrix.os, 'windows') }}
        run: |
          coverage run -m pytest -s -v --tb=short -k "not test_nwb_remote"

      - name: Generate coverage report
        run: coverage report -m

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
